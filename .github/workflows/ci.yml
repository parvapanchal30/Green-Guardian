name: ci

on:
  pull_request:
  push:
    branches: ["**"]  # feature branches get CI too; nothing merges to main without it
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      # Real PostgreSQL + PostGIS (no TLS, no stored password: the container only exists for this job and is
      # reachable only from the runner, hence trust auth; nothing here is a credential).
      postgres:
        image: postgis/postgis:17-3.5  # same major version as the hosted dev database (Supabase: PostgreSQL 17)
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ENV: test
      # Local container has no TLS. Hosted databases keep the secure default (DB_SSLMODE=require) because this
      # override exists only in this workflow.
      DB_SSLMODE: disable
      POSTGIS_SCHEMA: extensions
      # PostgreSQL tests may never be skipped in CI: a missing database fails the run instead.
      GG_REQUIRE_POSTGRES_TESTS: "1"
      DATABASE_URL: postgresql://postgres@localhost:5432/gg_ci
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/gg_ci
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"

      - name: Lint, format, types
        run: |
          ruff check .
          ruff format --check .
          mypy app

      # The postgis image installs PostGIS into `public` of its default database. A database from template0 is
      # pristine, so the migration installs PostGIS into the dedicated `extensions` schema exactly as on hosted
      # providers (docs/DATABASE_SETUP.md).
      - name: Create a pristine database
        run: psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE gg_ci TEMPLATE template0"

      - name: Migrate, check drift, verify, prove reversibility
        run: |
          alembic upgrade head
          alembic check
          python -m app.tools.check_db
          alembic downgrade base
          alembic upgrade head

      - name: Tests (plain run, any failure fails the job)
        run: pytest -q -rs --strict-markers

      # Where does request time go on a local database? Prints a table; compare with the remote profile in docs/DATABASE_SETUP.md.
      - name: Request profile (local PostgreSQL)
        run: GG_PROFILE=1 pytest tests/test_profile.py -q -s

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npm test
      - run: npm run build

  # Dependency vulnerability checks (production dependencies). A new advisory fails the build so it is seen and handled.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies (pip-audit)
        run: |
          pip install ./backend pip-audit
          pip-audit --skip-editable --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node dependencies (npm audit, production)
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

  # Container images: lint the Dockerfiles, build, scan for known vulnerabilities, then run the whole stack
  # (PostGIS + migrations + API + nginx) and exercise the real application through the proxy.
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning
      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning
      - name: Build images
        run: |
          docker build -t greenguardian-backend:local ./backend
          docker build -t greenguardian-web:local ./frontend
      # The scanner runs from its official container image at a pinned release (no third-party action involved).
      - name: Scan images for known vulnerabilities (HIGH/CRITICAL with a fix available)
        run: |
          for img in greenguardian-backend:local greenguardian-web:local; do
            echo "== $img"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/aquasecurity/trivy:0.76.0               image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress "$img"
          done
      - name: Compose smoke test
        run: bash ops/smoke-compose.sh

  # Prove the backup and restore procedure: dump a migrated, populated PostGIS database, restore it into a scratch
  # database, compare against the manifest, and show that tampering and unsafe targets are rejected.
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "backend[dev]"
      - name: Install PostgreSQL 17 client tools (pg_dump must be at least as new as the server)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # Ubuntu's pg_dump wrapper picks the oldest installed client; put version 17 first explicitly.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
      - name: Backup, restore, verify, and prove the safeguards
        run: bash ops/ci-backup-restore.sh
