# Local, self-contained stack: PostGIS + migrations + API + web (nginx). It does NOT use backend/.env, so it can never
# touch the hosted Supabase database. Secrets come from `.env.compose` (copy `.env.compose.example`; never commit it).
#
#   cp .env.compose.example .env.compose   # then set POSTGRES_PASSWORD and JWT_SECRET
#   docker compose --env-file .env.compose up --build
#   open http://localhost:8080
#
# Nothing here is a production deployment: see docs/DEPLOYMENT.md.
name: greenguardian

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.compose}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d greenguardian"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    image: greenguardian-backend:local   # the same image the API runs (built by the `backend` service below)
    command: ["alembic", "upgrade", "head"]
    environment: &api-env
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.compose}@db:5432/greenguardian
      DB_SSLMODE: disable            # the container database has no TLS; hosted databases keep the secure default
      POSTGIS_SCHEMA: extensions
      ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ characters) in .env.compose}
      TRUSTED_PROXY_COUNT: "1"       # nginx is the one proxy in front of the API
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-open_meteo}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    image: greenguardian-backend:local
    environment: *api-env
    volumes:
      - evidence:/data/storage      # uploaded photos; use a durable volume or an object store in real deployments
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Scheduled Botanical Operations Agent + housekeeping (audit retention, idle throttle counters). Same image as the API,
  # different command. All state is in the database, so it can be stopped, restarted or duplicated freely: overlapping
  # runs are impossible (one running row per workspace), a second worker is just redundant.
  worker:
    image: greenguardian-backend:local
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *api-env
      WORKER_POLL_INTERVAL_S: ${WORKER_POLL_INTERVAL_S:-60}
    healthcheck:   # the worker writes a heartbeat file every pass; the image's HTTP check does not apply to it
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 60s   # SIGTERM lets the run in progress finish before the process exits
    depends_on:
      backend:
        condition: service_healthy   # the image is built by `backend`; migrations are done by then
    restart: unless-stopped

  web:
    build: ./frontend
    image: greenguardian-web:local
    environment:
      API_UPSTREAM: http://backend:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  evidence:
